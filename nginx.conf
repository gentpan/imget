# img.et Nginx 站点配置（宝塔面板）
# 放入宝塔 > 网站 > img.et > 设置 > 配置文件
# 或 /www/server/panel/vhost/nginx/img.et.conf

server {
    listen 80;
    listen 443 ssl http2;
    server_name img.et;

    # SSL 证书（宝塔自动管理，路径按实际修改）
    # ssl_certificate     /www/server/panel/vhost/cert/img.et/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/img.et/privkey.pem;

    root /www/wwwroot/img.et;
    index index.php;

    # 日志
    access_log /www/wwwlogs/img.et.log;
    error_log  /www/wwwlogs/img.et.error.log;

    # 禁止访问敏感文件
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /composer\.(json|lock)$ {
        deny all;
        return 404;
    }
    location ~ ^/vendor/ {
        deny all;
        return 404;
    }
    location ~ ^/database/ {
        deny all;
        return 404;
    }

    # 静态资源缓存
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /favicon.ico {
        expires 30d;
        try_files $uri =404;
    }

    # 管理后台
    location ^~ /admin/ {
        try_files $uri /admin/index.php?$query_string;
    }
    location = /admin/index.php {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # 图片路由：/宽/高 → imageRouter.php
    location ~ ^/\d{2,4}/\d{2,4}/?$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/imageRouter.php;
        fastcgi_read_timeout 60;
    }

    # 公开图片详情页：/p/type/filename 或 /p/files/type/filename
    location ~ ^/p/(files/)?[a-z0-9_-]+/[A-Za-z0-9_-]+\.[A-Za-z0-9]+$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/imageRouter.php;
        fastcgi_read_timeout 30;
    }

    # 公开图片直链：/files/type/filename 或 /type/filename.ext
    location ~ ^/(files/)?[a-z0-9_-]+/[A-Za-z0-9_-]+\.[A-Za-z0-9]+$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/imageRouter.php;
        fastcgi_read_timeout 30;
    }

    # 首页
    location = / {
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 禁止直接访问其他 PHP 文件
    location ~ \.php$ {
        deny all;
        return 404;
    }
}
